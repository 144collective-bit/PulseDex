# What a clean checkout has to survive before it reaches pulsedex.net.
#
# Every step here is a command a contributor already runs locally. The point of
# running them again on GitHub is the "clean checkout" part: this repository has
# already shipped a package-lock.json that `npm install` quietly rewrote on
# every machine and that `npm ci` refused outright, which is invisible until
# something starts from nothing. This does, on every push.
#
# Vercel builds and deploys on its own, from its GitHub integration. It is not
# waiting on this workflow and will not be blocked by it - a red run here means
# the commit is broken, not that the deploy was stopped.

name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}

  # On a branch, yes: nobody needs a verdict on a commit that has already been
  # replaced. On main, never. Every commit there is deployed to pulsedex.net,
  # and cancelling means a commit reaches production with no verdict at all -
  # which is not hypothetical. Merging the two action bumps a few minutes
  # apart did exactly that: the run for the first was cancelled by the second,
  # and ff3b419 is on main having never been checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: install, lint, test, build
    runs-on: ubuntu-latest

    # Pushing a branch in this repository already triggers this workflow, so
    # opening a pull request from that branch would only run it a second time
    # on the same commits. A fork cannot push here, so its pull request is the
    # one case that needs the pull_request event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # From .nvmrc, so the version lives in one place. It tracks the
          # Vercel project's Node setting - a build that passes here on a
          # different major than production proves less than it appears to.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: it installs exactly what the lockfile says and fails
      # if package.json disagrees with it, which is the check that was missing.
      - run: npm ci

      - run: npm run lint

      # The serverless handlers, loaded the way Vercel's Node runtime loads
      # them. Everything else here resolves imports through Vite, which
      # accepts an extensionless relative path that Node refuses - so a
      # handler can pass lint, test and build and still be a module-not-found
      # at the first request after deploy.
      - run: npm run check:api

      # Exits non-zero on an unhandled rejection as well as a failed
      # assertion, which is deliberate - the suite has been green and broken
      # at the same time before.
      - run: npm test

      - run: npm run build

      # And then open it.
      #
      # The five checks above never render a page: lint reads syntax, check:api
      # imports handlers without calling them, the suite runs pure functions,
      # and the build only compiles. A tab that throws on mount - or one whose
      # code fails to arrive at all - passes every one of them and shows the
      # reader a white screen. That has now happened in production twice.
      #
      # Supabase is answered by the harness rather than reached, so this needs
      # no credentials. The mock URL still has to be set at build time: without
      # it `hasSupabase` is false, the app asks for nothing, and the social
      # surfaces measure as perfect while proving nothing.
      # playwright-core, not playwright: the harness drives a browser and needs
      # nothing else from the package. --with-deps because a bare runner is
      # missing the shared libraries Chromium links against.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build and drive the app in a browser
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock
        run: |
          npm run build
          npx vite preview --port 4317 --host 127.0.0.1 &
          # Wait for the preview server rather than sleeping at it. A fixed
          # sleep is either too short on a slow runner or wasted on a fast one.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4317/ && break
            sleep 1
          done

          # Does every page come up on a fair wind?
          npm run smoke:browser -- http://127.0.0.1:4317

          # And what happens when it does not: nulls in every nullable column,
          # an empty database, one that refuses, a phone, signed out, and tabs
          # switched faster than the fetches settle. Three bugs came out of the
          # first run of this, one of which had been silently deleting profile
          # links. It reuses the server and the Chromium above, so the cost is
          # the run itself - revisit if it ever becomes the slow part.
          npm run stress -- http://127.0.0.1:4317

          # One shell, deliberately: the preview server is a background process
          # of this step, and a later step relying on it having survived is a
          # thing that works until it does not.
