# What a clean checkout has to survive before it reaches pulsedex.net.
#
# Every step here is a command a contributor already runs locally. The point of
# running them again on GitHub is the "clean checkout" part: this repository has
# already shipped a package-lock.json that `npm install` quietly rewrote on
# every machine and that `npm ci` refused outright, which is invisible until
# something starts from nothing. This does, on every push.
#
# Vercel builds and deploys on its own, from its GitHub integration. It is not
# waiting on this workflow and will not be blocked by it - a red run here means
# the commit is broken, not that the deploy was stopped.

name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}

  # On a branch, yes: nobody needs a verdict on a commit that has already been
  # replaced. On main, never. Every commit there is deployed to pulsedex.net,
  # and cancelling means a commit reaches production with no verdict at all -
  # which is not hypothetical. Merging the two action bumps a few minutes
  # apart did exactly that: the run for the first was cancelled by the second,
  # and ff3b419 is on main having never been checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: install, lint, test, build
    runs-on: ubuntu-latest

    # Pushing a branch in this repository already triggers this workflow, so
    # opening a pull request from that branch would only run it a second time
    # on the same commits. A fork cannot push here, so its pull request is the
    # one case that needs the pull_request event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # From .nvmrc, so the version lives in one place. It tracks the
          # Vercel project's Node setting - a build that passes here on a
          # different major than production proves less than it appears to.
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: it installs exactly what the lockfile says and fails
      # if package.json disagrees with it, which is the check that was missing.
      - run: npm ci

      - run: npm run lint

      # The serverless handlers, loaded the way Vercel's Node runtime loads
      # them. Everything else here resolves imports through Vite, which
      # accepts an extensionless relative path that Node refuses - so a
      # handler can pass lint, test and build and still be a module-not-found
      # at the first request after deploy.
      - run: npm run check:api

      # Exits non-zero on an unhandled rejection as well as a failed
      # assertion, which is deliberate - the suite has been green and broken
      # at the same time before.
      - run: npm test

      - run: npm run build
