    <meta http-equiv="Permissions-Policy" content="autoplay=(), speaker=(), microphone=()" />
    <script>
      // Pre-emptive Audio Silencer Lock
      try {
        window.Audio = class { play() { return Promise.resolve(); } pause() {} };
        window.AudioContext = class { constructor() { this.state = 'suspended'; } resume() { return Promise.resolve(); } };
        window.webkitAudioContext = window.AudioContext;
        if (window.HTMLMediaElement) {
          window.HTMLMediaElement.prototype.play = function() { this.muted = true; return Promise.resolve(); };
        }
      } catch (e) {}
    </script>
