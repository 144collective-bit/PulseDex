<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hdrn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <linearGradient id="f2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <linearGradient id="f3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="f4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00b386"/>
    </linearGradient>
    <linearGradient id="f5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a3e5ff"/>
    </linearGradient>
    <linearGradient id="f6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#hdrn-bg)" stroke="#9d4edd" stroke-width="2"/>
  
  <!-- Hedron 3D Geometric Facets -->
  <g filter="url(#glow)">
    <!-- Top Center -->
    <polygon points="50,18 68,34 50,44" fill="url(#f5)" opacity="0.95"/>
    <polygon points="50,18 32,34 50,44" fill="url(#f1)" opacity="0.9"/>
    <!-- Left Wing -->
    <polygon points="32,34 20,52 38,58" fill="url(#f2)" opacity="0.95"/>
    <polygon points="32,34 50,44 38,58" fill="url(#f6)" opacity="0.85"/>
    <!-- Right Wing -->
    <polygon points="68,34 80,52 62,58" fill="url(#f3)" opacity="0.95"/>
    <polygon points="68,34 50,44 62,58" fill="url(#f4)" opacity="0.85"/>
    <!-- Center Diamond -->
    <polygon points="50,44 62,58 50,72 38,58" fill="url(#f1)" opacity="0.95"/>
    <!-- Bottom Left -->
    <polygon points="20,52 38,58 35,78" fill="url(#f3)" opacity="0.85"/>
    <polygon points="38,58 50,72 50,84 35,78" fill="url(#f2)" opacity="0.9"/>
    <!-- Bottom Right -->
    <polygon points="80,52 62,58 65,78" fill="url(#f4)" opacity="0.85"/>
    <polygon points="62,58 50,72 50,84 65,78" fill="url(#f6)" opacity="0.9"/>
  </g>
</svg>
